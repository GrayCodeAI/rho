# Rho CI agent (headless)
#
# Copy to .github/workflows/rho-ci-exec.yml.
# Runs a non-interactive agent turn with JSON output — suitable for
# "fix failing tests", "summarize this PR", or similar CI jobs.
#
# Prerequisites:
#   - rho binary on PATH (pin a release or install from your org's package)
#   - LLM credentials via secrets (never commit keys)
#   - A host runner with the permissions required by the checked-out project
#
name: Rho CI Exec

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Agent prompt"
        required: true
        default: "Summarize the git diff for this PR and list the riskiest files."

permissions:
  contents: read
  pull-requests: read

jobs:
  rho-exec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install rho with your org's preferred mechanism, for example:
      #   - curl -fsSL https://…/install.sh | sh
      #   - go install github.com/GrayCodeAI/rho/cmd/rho@vX.Y.Z
      #   - download a release asset into $GITHUB_PATH
      - name: Ensure rho is available
        run: |
          if ! command -v rho >/dev/null 2>&1; then
            echo "Install rho before this step (see comments in this workflow)."
            exit 1
          fi
          rho version || rho --version || true

      - name: Trust workspace (folder trust)
        run: rho trust add --reason "github-actions ci" || true

      - name: Run agent (ephemeral + JSON)
        id: agent
        env:
          # Map your provider key(s) here, e.g. ANTHROPIC_API_KEY / OPENAI_API_KEY.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RHO_PROMPT: ${{ github.event.inputs.prompt || 'Summarize the changes in this PR (git log/diff) and list risks.' }}
        run: |
          set -euo pipefail
          PROMPT="${RHO_PROMPT}"
          rho exec \
            --ephemeral \
            --json \
            --auto full \
            --max-turns 20 \
            "$PROMPT" | tee rho-result.json

      - name: Upload agent result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rho-result
          path: rho-result.json
