# DEPRECATED — the canonical inventory moved.
#
# This file is no longer the source of truth. As of 2026-10-02 the canonical
# inventory is:
#
#     GrayCodeAI/graycode-eco  ->  ecosystem.yaml
#
# Why it moved: a product cannot own the registry of its siblings. This file
# lived inside `rho` and described itself as canonical, which meant `rho` could
# rename itself without signalling the other nine repositories. It did exactly
# that — the organization holds `hawk` and `eyrie` as redirects from the prior
# names of `rho` and `flux`. The list also omitted `beam` entirely.
#
# What is still true below, and what is not:
#
#   - The `contracts` block is accurate and is now maintained in the roof.
#   - The repository list is INCOMPLETE: `beam` is missing, and `lean-prover`
#     and `graycode-logo` are unaccounted for.
#   - `tracks_eagle` and other historical fields describe a removed ecosystem.
#
# Consumers should migrate:
#
#   scripts/ecosystem-manifest.sh          reads this file
#   scripts/generate-workspace.sh          calls the above
#   scripts/check-module-release-parity.sh  reads this file
#   .github/actions/checkout-flux          calls the above
#   .github/actions/setup-deps             calls the above
#
# The migration keeps `rho/scripts/ecosystem-manifest.sh` as the single reader,
# repointed at the roof's file, with a fallback to this one when the roof is not
# checked out. The scripts do not need to know where the manifest lives.
#
# See graycode-eco/adr/0001 for the decision and the reasoning.

schema_version: 1

contracts:
  portable_graph_schema: rho.graph/v1
  cloud_graph_schema: graycode-cloud.graph/v1
  usage_event: usage.recorded.v1

repositories:
  - directory: rho
    github_repo: rho
    product_name: Rho
    kind: product
    language: go
    module: github.com/GrayCodeAI/rho
    workspace: true

  - directory: flux
    github_repo: flux
    product_name: Flux
    kind: engine
    language: go
    module: github.com/GrayCodeAI/flux
    workspace: true
    facade: github.com/GrayCodeAI/flux/engine

  - directory: graycode-skills
    github_repo: graycode-skills
    product_name: Rho Community Skills
    kind: extension
    language: python
    workspace: false

  - directory: graycode-platform
    github_repo: graycode-platform
    product_name: GrayCode Web and Cloud
    kind: platform
    language: typescript
    workspace: false

  - directory: rover
    github_repo: rover
    product_name: Rover
    kind: tooling
    language: go
    module: github.com/GrayCodeAI/rover
    workspace: false

  - directory: across
    github_repo: across
    product_name: Across
    kind: tooling
    language: go
    module: github.com/graycodeai/across
    workspace: false

  - directory: radius
    github_repo: radius
    product_name: Radius
    kind: product
    language: typescript
    # Not a Go module: radius is a pnpm workspace, so it takes no part in
    # rho's go.work. `workspace: true` here would make CI try to check it out
    # as a Go sibling and fail.
    workspace: false

  - directory: trace
    github_repo: trace
    product_name: Trace
    kind: product
    language: go
    module: github.com/GrayCodeAI/trace
    workspace: false

  - directory: trail
    github_repo: trail
    product_name: Trail
    kind: product
    language: go
    module: github.com/graycodeai/trail
    workspace: false
