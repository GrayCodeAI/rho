schema_version: 1

# Canonical repository inventory for the GrayCodeAI ecosystem. Repository
# directories and GitHub repository names are listed per repository;
# product_name records the user-facing capability. Tooling must consume this
# file instead of carrying its own repo-name list. Only repositories that
# exist are listed: removed siblings stay out until they are restored.
contracts:
  portable_graph_schema: rho.graph/v1
  cloud_graph_schema: graycode-cloud.graph/v1
  usage_event: usage.recorded.v1

repositories:
  - directory: rho
    github_repo: rho
    product_name: Rho
    kind: product
    language: go
    module: github.com/GrayCodeAI/rho
    workspace: true

  - directory: flux
    github_repo: flux
    product_name: Flux
    kind: engine
    language: go
    module: github.com/GrayCodeAI/flux
    workspace: true
    facade: github.com/GrayCodeAI/flux/engine

  - directory: graycode-skills
    github_repo: graycode-skills
    product_name: Rho Community Skills
    kind: extension
    language: python
    workspace: false

  - directory: graycode-platform
    github_repo: graycode-platform
    product_name: GrayCode Web and Cloud
    kind: platform
    language: typescript
    workspace: false

  - directory: rover
    github_repo: rover
    product_name: Rover
    kind: tooling
    language: go
    workspace: false

  - directory: across
    github_repo: across
    product_name: Across
    kind: tooling
    language: go
    workspace: false
